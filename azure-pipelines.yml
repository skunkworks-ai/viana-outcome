# Disable triggering CI build through PR
pr: none

trigger:
# Will trigger when tags are in the ff. forms:
#   1. v1.0.0-alpha.1+outcome
#   2. v1.0.0-beta+outcome
#   3. v1.0.0+outcome
# Won't trigger when tags are missing the '+' build suffix e.g.
#   v1.0.0-alpha, v1.0.0-beta.1 or v1.0.0
  tags:
    include:
      - v*.*.*+*

pool:
# Using the same Ubuntu version as specified in Dockerfile
  vmImage: ubuntu-22.04

variables:
  COMPOSE_BAKE: 1
  SERVICE_CONNECTION: 3c90d7b9-95d9-4a67-aa95-33ae6de45469
  REGISTRY_URL: vianaacr.azurecr.io

stages:
- stage: A
  displayName: Derive image version tag based on Git tag
  jobs:
  - job: A1
    displayName: Derive image version tag job
    steps:
    - bash: |
        BRANCH=$(Build.SourceBranchName)  # Tag that triggered the build
        VERSION=${BRANCH#v}               # Remove the "v" prefix from tag
        VERSION=${VERSION%+*}             # Remove the "+*" suffix from tag

        echo "BRANCH is: $BRANCH"
        echo "VERSION is: $VERSION"

        echo "##vso[task.setvariable variable=version;isOutput=true]$VERSION"
      name: DerivedImageTag
      displayName: Derive image version tag
- stage: B
  displayName: Build and push service images with Docker Compose
  dependsOn: A
  variables:
    TAG_VERSION: $[stageDependencies.A.A1.outputs['DerivedImageTag.version']]
  jobs:
  - job: B1
    displayName: Build services with --push job
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: $(SERVICE_CONNECTION)
        command: login
      displayName: Login to registry
    - task: DockerCompose@1
      inputs:
        containerregistrytype: Azure Container Registry
        azureContainerRegistry: $(SERVICE_CONNECTION)
        dockerComposeFile: $(Build.SourcesDirectory)/docker-compose.yml
        additionalDockerComposeFiles: |
          docker-compose.dev.yml
          docker-compose.outcome.yml
        dockerComposeFileArgs: |
          REGISTRY_URL=$(REGISTRY_URL)
          OUTCOME_VERSION=$(TAG_VERSION)
        projectName: outcome
        action: 'Build services'
        additionalImageTags: |
          $(TAG_VERSION)
        arguments: |
          --push
      displayName: Build services with --push task

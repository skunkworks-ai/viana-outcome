# Disable triggering CI build through PR
pr: none

trigger:
# Will trigger when tags are in the ff. forms:
#   1. v1.0.0-alpha.1+outcome
#   2. v1.0.0-beta+outcome
#   3. v1.0.0+outcome
# Won't trigger when tags are missing the '+' build suffix e.g.
#   v1.0.0-alpha, v1.0.0-beta.1 or v1.0.0
  tags:
    include:
      - v*.*.*+*

variables:
  TAG_NAME: $(Build.SourceBranchName)
  REGISTRY_SERVICE_CONNECTION: 3c90d7b9-95d9-4a67-aa95-33ae6de45469
  DOCKERFILE_SERVER: $(Build.SourcesDirectory)/Dockerfile
  REPOSITORY_SERVER: cvat/server
  DOCKERFILE_UI: $(Build.SourcesDirectory)/Dockerfile.ui
  REPOSITORY_UI: cvat/ui

pool:
  vmImage: ubuntu-latest

stages:
- stage: BuildAndPushServer
  displayName: 'Build and push server image'
  jobs:
  - job: BuildAndPushServerJob
    steps:
    - task: Docker@2
      inputs:
        command: buildAndPush
        repository: $(REPOSITORY_SERVER)
        dockerfile: $(DOCKERFILE_SERVER)
        containerRegistry: $(REGISTRY_SERVICE_CONNECTION)
        tag: |
          ${TAG_NAME#v}

- stage: BuildAndPushUI
  displayName: 'Build and push UI image'
  jobs:
  - job: BuildAndPushUIJob
    steps:
    - task: Docker@2
      inputs:
        command: buildAndPush
        repository: $(REPOSITORY_UI)
        dockerfile: $(DOCKERFILE_UI)
        containerRegistry: $(REGISTRY_SERVICE_CONNECTION)
        tag: |
          ${TAG_NAME#v}

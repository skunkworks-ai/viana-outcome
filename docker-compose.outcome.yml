services:
  cvat_server:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}
    build:
      args:
        - DJANGO_SETTINGS_MODULE=cvat.settings.outcome
    env_file:
#       Copy .env.sample to .env and fill with proper values
      - path: .env

  cvat_worker_utils:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_import:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_export:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_annotation:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_webhooks:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_quality_reports:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_chunks:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_worker_consensus:
    image: ${REGISTRY_URL}/cvat/server:${OUTCOME_VERSION}

  cvat_ui:
    image: ${REGISTRY_URL}/cvat/ui:${OUTCOME_VERSION}